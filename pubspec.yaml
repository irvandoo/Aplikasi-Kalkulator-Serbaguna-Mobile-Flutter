name: kalkulatorserbaguna
description: "Kalkulator Serbaguna - kalkulator dasar, persen, diskon, belanja, dan harga satuan. Offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.1.1
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  google_mobile_ads: ^9.2.0
  decimal: ^3.2.6
  intl: ^0.20.3
  share_plus: ^13.3.1
  path: ^1.9.1
  sqflite_common_ffi_web: ^1.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo_kalkulator_serbaguna.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_kalkulator_serbaguna.png"
  adaptive_icon_foreground_inset: 14

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_kalkulator_serbaguna.png
    - assets/legal/kebijakan_privasi.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
